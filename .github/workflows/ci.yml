name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build Docker image
        run: docker build -t greengrid-optimizer:ci .

      - name: Run test suite
        run: docker run --rm greengrid-optimizer:ci python -m pytest tests/ -v
