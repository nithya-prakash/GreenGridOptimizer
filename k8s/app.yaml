apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: greengrid-state
  namespace: greengrid
spec:
  accessModes: ["ReadWriteOnce"]
  resources: {requests: {storage: 2Gi}}
---
# The image deliberately excludes data/ and models/ (see CI "not baked into the image" check): they live on the
# PVC. Seed it once with the trained models and processed data, e.g.
#   kubectl -n greengrid cp models <api-pod>:/app/models -c api   (and data/, mlruns/)
# The API and the updater share the volume, so they run as two containers in ONE pod (ReadWriteOnce).
apiVersion: apps/v1
kind: Deployment
metadata:
  name: api
  namespace: greengrid
spec:
  replicas: 1
  strategy: {type: Recreate}
  selector:
    matchLabels: {app: api}
  template:
    metadata:
      labels: {app: api}
    spec:
      containers:
        - name: api
          image: greengrid-optimizer:local
          imagePullPolicy: IfNotPresent
          command: ["uvicorn", "src.api.main:app", "--host", "0.0.0.0", "--port", "8000"]
          ports: [{containerPort: 8000}]
          env:
            - {name: PYTHONPATH, value: /app}
          envFrom:
            - secretRef: {name: greengrid-secrets, optional: true}
          readinessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 10
            periodSeconds: 10
          livenessProbe:
            httpGet: {path: /health, port: 8000}
            initialDelaySeconds: 30
            periodSeconds: 20
          resources:
            requests: {cpu: 250m, memory: 768Mi}
            limits: {memory: 1536Mi}
          volumeMounts:
            - {name: state, mountPath: /app/data, subPath: data}
            - {name: state, mountPath: /app/models, subPath: models}
            - {name: state, mountPath: /app/mlruns, subPath: mlruns}
        - name: updater
          image: greengrid-optimizer:local
          imagePullPolicy: IfNotPresent
          command: ["python", "-m", "src.jobs.refresh"]
          env:
            - {name: PYTHONPATH, value: /app}
          envFrom:
            - secretRef: {name: greengrid-secrets, optional: true}
          resources:
            requests: {cpu: 100m, memory: 512Mi}
            limits: {memory: 1536Mi}
          volumeMounts:
            - {name: state, mountPath: /app/data, subPath: data}
            - {name: state, mountPath: /app/models, subPath: models}
            - {name: state, mountPath: /app/mlruns, subPath: mlruns}
      volumes:
        - name: state
          persistentVolumeClaim: {claimName: greengrid-state}
---
apiVersion: v1
kind: Service
metadata:
  name: api
  namespace: greengrid
spec:
  selector: {app: api}
  ports: [{port: 8000, targetPort: 8000}]
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: greengrid
spec:
  replicas: 1
  selector:
    matchLabels: {app: frontend}
  template:
    metadata:
      labels: {app: frontend}
    spec:
      containers:
        - name: frontend
          image: greengrid-optimizer:local
          imagePullPolicy: IfNotPresent
          command: ["streamlit", "run", "frontend/streamlit_app.py", "--server.address=0.0.0.0"]
          ports: [{containerPort: 8501}]
          env:
            - {name: PYTHONPATH, value: /app}
            - {name: API_BASE, value: "http://api:8000"}
          readinessProbe:
            httpGet: {path: /_stcore/health, port: 8501}
            initialDelaySeconds: 10
          resources:
            requests: {cpu: 100m, memory: 384Mi}
            limits: {memory: 1Gi}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: greengrid
spec:
  selector: {app: frontend}
  ports: [{port: 8501, targetPort: 8501}]
