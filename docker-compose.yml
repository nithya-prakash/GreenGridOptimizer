# Ports are published on 127.0.0.1 only: reachable from this machine, not from
# the network. To expose the API/dashboard deliberately (e.g. behind a reverse
# proxy with TLS), change the host part of the mapping — see README "Security".
services:
  api:
    build: .
    command: uvicorn src.api.main:app --host 0.0.0.0 --port 8000
    ports:
      - "127.0.0.1:8000:8000"
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./mlruns:/app/mlruns
    # Optional: without a .env file the stack still starts (chat returns 503,
    # ingestion uses SMARD). Mounting ./.env as a file instead made Docker
    # create an empty *directory* named .env whenever the file was missing.
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONPATH=/app

  frontend:
    build: .
    command: streamlit run frontend/streamlit_app.py --server.address=0.0.0.0
    ports:
      - "127.0.0.1:8501:8501"
    depends_on:
      - api
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONPATH=/app
      - API_BASE=http://api:8000

  # Re-ingests data every refresh.interval_hours and retrains weekly
  # (configs/pipeline.yaml), so the dashboard doesn't forecast from stale data.
  updater:
    build: .
    command: python -m src.jobs.refresh
    volumes:
      - ./data:/app/data
      - ./models:/app/models
      - ./mlruns:/app/mlruns
    env_file:
      - path: .env
        required: false
    environment:
      - PYTHONPATH=/app
    restart: unless-stopped

  # Developer tool, not part of the product: MLflow has no authentication and
  # accepts tracking writes, so it only starts on request
  # (`docker compose --profile dev-tools up mlflow`) and only on localhost.
  mlflow:
    build: .
    profiles: ["dev-tools"]
    command: mlflow ui --host 0.0.0.0 --port 5000 --backend-store-uri sqlite:////app/mlruns/mlflow.db
    ports:
      - "127.0.0.1:5000:5000"
    volumes:
      - ./mlruns:/app/mlruns
    environment:
      - PYTHONPATH=/app
